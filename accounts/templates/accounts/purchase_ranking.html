{% extends 'base.html' %}
{% block content %}
<div class="p-3 mt-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2>User purchased ranking</h2>

        <form method="GET">
          <label for="limit">Number of users:</label>
          <input type="number" name="limit" id="limit" min="1" value="{{ template_data.limit }}">
          <button type="submit">Show</button>
        </form>

        {% for user in template_data.users %}
            <p>
                {{user.username}} : {{user.purchase_count}}
            </p>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock content %}
